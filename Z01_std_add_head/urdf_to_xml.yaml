# Z01_std_add_head URDF → XML 生成配置（量产加头版，继承 Z01_std 的量产配置）
# 头部/踝部补丁与 motor 规则对齐 t4_std_add_head.xml；armature 取自 csv 手工填写值。
# 注意：joints/motors/extras 列表整体替换继承值，patches 沿继承链累加。

extends: ../Z01_std/urdf_to_xml.yaml

default:
  joint: {armature: null}   # 无默认 armature，逐关节规则见下

joints:                     # armature 来自 csv 手工填写值（URDF 无此属性）
  - {pattern: "*_shoulder_*",  armature: 0.0027}
  - {pattern: "*_elbow*",      armature: 0.0027}
  - {pattern: "*_wrist_yaw",   armature: 0.0027}
  - {pattern: "*_wrist_*",     armature: 0.005521}
  - {pattern: "waist_pitch",   armature: 0.0027}
  - {pattern: "waist_roll",    armature: 0.0027}
  - {pattern: "waist_yaw",     armature: 0.041}
  - {pattern: "*_hip_pitch",   armature: 0.041}
  - {pattern: "*_hip_roll",    armature: 0.041}
  - {pattern: "*_hip_yaw",     armature: 0.041}
  - {pattern: "*_knee*",       armature: 0.041}
  - {pattern: "*_ankle_pitch", armature: 0.0077733}
  - {pattern: "*_ankle_roll",  armature: 0.0026244}
  - {pattern: "*_ankle_1",     armature: 0.0027}   # 供 parallel_ankle 继承（本模型无此关节）
  - {pattern: "*_ankle_2",     armature: 0.0027}   # 供 parallel_ankle 继承（本模型无此关节）
  - {pattern: "head_pitch",    armature: 0.005521}
  - {pattern: "head_yaw",      armature: 0.005521}

motors:
  rules:                      # 覆盖继承的规则（列表整体替换）
    - {pattern: "waist_pitch", ctrlrange: 7200}
    - {pattern: "waist_roll",  ctrlrange: 7200}
    - {pattern: "head_*",      ctrlrange: 12}   # 对齐 t4_std_add_head.xml
  order: [head_yaw, head_pitch]   # 头电机置前（对齐手写 t4_std_add_head.xml 执行器顺序）

# 手工补丁（仅 --final 输出 Z01_std_add_head.xml 时应用；patches 沿 extends 链累加，
# 装饰调试几何已由 Z01_std 的 patches 提供，此处不再重复列出）
patches:
  # torso_link 的 fixed 折叠残留由 Z01_std 的 patches 统一清理
  # camera 为 fixed 关节，camera_link 的 1 mm 占位小球会折叠进 head_pitch_link，移除之
  - {op: remove, xpath: "worldbody/.//body[@name='head_pitch_link']/geom[@size='0.001']"}

extras:
  # 深度相机固定在 pitch 自由度上（camera 为 fixed，camera_link 折叠进 head_pitch_link）。
  # pos 相对 head_pitch_link；xyaxes 表示相机前向 +x 下俯 36°。
  - xpath: "worldbody/.//body[@name='head_pitch_link']"
    append: |
      <camera name="depth_cam" pos="0.065162 0 0.0934945"
              xyaxes="0 -1 0 0.587785 0 0.809017" fovy="58.29" resolution="64 36"/>
