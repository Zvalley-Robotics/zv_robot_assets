# Z01_std URDF → XML 生成配置（量产版，与 Z01_edm 相互独立，不复用其配置）
# 基座高度/执行器/装饰补丁对齐手写 t4_std.xml；地面/传感器走脚本内置默认（t4 式）；
# armature 取自 csv 手工填写值，关节限幅不设逐关节规则（保留 URDF effort 导入值）。

freejoint:
  pos: "0 0 0.9"        # 基座初始高度（对齐 t4_std.xml）

default:
  joint: {armature: null}   # 无默认 armature，逐关节规则见下

joints:                     # armature 来自 csv 手工填写值（URDF 无此属性）
  - {pattern: "*_shoulder_*",  armature: 0.0027}
  - {pattern: "*_elbow*",      armature: 0.0027}
  - {pattern: "*_wrist_yaw",   armature: 0.0027}
  - {pattern: "*_wrist_*",     armature: 0.005521}
  - {pattern: "waist_pitch",   armature: 0.0027}
  - {pattern: "waist_roll",    armature: 0.0027}
  - {pattern: "waist_yaw",     armature: 0.041}
  - {pattern: "*_hip_pitch",   armature: 0.041}
  - {pattern: "*_hip_roll",    armature: 0.041}
  - {pattern: "*_hip_yaw",     armature: 0.041}
  - {pattern: "*_knee*",       armature: 0.041}
  - {pattern: "*_ankle_pitch", armature: 0.0077733}
  - {pattern: "*_ankle_roll",  armature: 0.0026244}

motors:
  ctrlrange: frcrange    # 跟随关节最终 actuatorfrcrange
  rules:
    - {pattern: "waist_pitch", ctrlrange: 7200}   # 对齐 t4_std.xml 的例外
    - {pattern: "waist_roll",  ctrlrange: 7200}

visuals:
  collision_rgba: "0.76 0.76 0.76 0"   # 恢复踝部碰撞 box 的透明调试色

# 视觉清理 patches；碰撞体由文件末尾的 collisions 段统一生成（全 capsule）
patches:
  # 删除 fixed 关节折叠残留：waist_pitch/roll、head_yaw/head_pitch、camera 合并进
  # torso_link 的占位球（URDF 导入器对球体省略 type 属性）
  - {op: remove, xpath: "worldbody/body[@name='torso_link']/geom[not(@type)]"}

# 头部相机。Z01_std 的头部关节全部为 fixed，URDF 导入器会把 head_yaw_link /
# head_pitch_link / camera_link 折叠进 torso_link，因此相机直接挂在 torso_link 上；
# pos = head_yaw(0.0005 0 0.325) + head_pitch(0 0 0.054) + camera(0.065162 0 0.0934945)
# 的累积平移，xyaxes 表示相机前向 +x 下俯 36°。
extras:
  - xpath: "worldbody/body[@name='torso_link']"
    append: |
      <camera name="depth_cam" pos="0.065662 0 0.4724945"
              xyaxes="0 -1 0 0.587785 0 0.809017" fovy="58.29" resolution="64 36"/>

# 全胶囊碰撞体（连杆局部坐标，米）。所有数值均为手工调校，勿用 fit_capsule_collisions.py 覆盖。
# 头部折叠规则：head_yaw_link / head_pitch_link 的胶囊在头部为 fixed 的变体（Z01_std）中
# 由生成器沿 fixed 关节链折叠进 torso_link，在 add_head 系列中则挂到各自可动 body 上。

collisions:
  enabled: true
  remove_existing: true
  exclude_adjacent: true
  # 同链 / 中轴内部：运动链距离 ≤N 的 body 对排除（子链相邻连杆不互撞）
  exclude_distance: 4
  # 中轴（躯干/腰/头）↔ 四肢：只排除链内前 N 级（肩/髋 pitch、roll、yaw）。
  # 肩 yaw / 髋 yaw 的胶囊在几何上必然与躯干重叠（随机位姿接触率 ~99%），必须排除；
  # 更外层（elbow、wrist_*、knee、ankle_*）保留与躯干的碰撞，
  # 保证手臂/小腿扫到躯干时确实产生接触。
  center_limb_distance: 3
  # 左右髋的胶囊在骨盆处几何上互相穿插（hip_roll ≈ -15 mm、hip_yaw ≈ -37 mm），
  # 且不属于"同级兄弟连杆"，需显式排除；hip_pitch 已由兄弟规则排除。
  exclude_pairs:
    - [left_hip_roll_link, right_hip_roll_link]
    - [left_hip_yaw_link, right_hip_yaw_link]
  group: 3
  rgba: "1 0.3 0.3 0.35"
  links:
    head_pitch_link:
      - {fromto: "0.0075 0 0.04 0.0045 0 0.089", size: 0.072}
    head_yaw_link:
      - {fromto: "0.0015 0 -0.015 0.0015 0 0.055", size: 0.039}
    left_ankle_roll_link:
      - {fromto: "0.125 -0.03 -0.0245 0.055 -0.03 -0.0245", size: 0.01}
      - {fromto: "-0.041 -0.02 -0.0245 0.138 -0.02 -0.0245", size: 0.01}
      - {fromto: "-0.05 -0.01 -0.0245 0.145 -0.01 -0.0245", size: 0.01}
      - {fromto: "-0.051 0 -0.0245 0.148 0 -0.0245", size: 0.01}
      - {fromto: "-0.051 0.01 -0.0245 0.145 0.01 -0.0245", size: 0.01}
      - {fromto: "-0.041 0.02 -0.0245 0.138 0.02 -0.0245", size: 0.01}
      - {fromto: "0.125 0.03 -0.0245 0.055 0.03 -0.0245", size: 0.01}
      - {fromto: "-0.036 0 -0.0115 0.115 0 -0.0115", size: 0.025}
    left_elbow_link:
      - {fromto: "0 -0.01 0 0 0.02 0", size: 0.037}
    left_hip_pitch_link:
      - {fromto: "0 -0.01 -0.005 0 0.05 -0.03", size: 0.055}
