      - {fromto: "-0.014 0 -0.195 -0.014 0 -0.08", size: 0.04}
    left_shoulder_pitch_link:
      - {fromto: "0.01 0.05 0 -0.01 0.05 0", size: 0.04}
    left_shoulder_roll_link:
      - {fromto: "0 0.0065 -0.13 0 0.0065 -0.015", size: 0.0365}
